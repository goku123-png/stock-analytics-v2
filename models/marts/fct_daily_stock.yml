version: 2

models:
  - name: fct_daily_stock
    description: "One row per stock per trading day."

    columns:
      - name: stock_date_key
        data_tests:
          - unique
          - not_null

      - name: company_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_key

      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key