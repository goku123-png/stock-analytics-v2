version: 2

models:
  - name: stg_stock_prices
    description: "One row per stock per trading day."
    columns:
      - name: stock_date_key
        data_tests:
          - unique
          - not_null

      - name: ticker
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["AAPL", "AMZN", "GOOGL", "MSFT", "NVDA"]

      - name: trading_date
        data_tests:
          - not_null

      - name: adjusted_close_price
        data_tests:
          - not_null

      - name: volume
        data_tests:
          - not_null